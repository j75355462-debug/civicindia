<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civics Sense India – Learn, Play, Get Certified</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cinzel:wght@600;800&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@500;600&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4faf6;--card:#fff;--ink:#12263f;--mute:#5b6b7e;--line:#d9e5de;--blue:#0b4a8f;--green:#12a05a;--gd:#0c7a43;--saf:#ff9933;--red:#e5484d;--soft:#e8f5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--card:#14233a;--ink:#eaf2fb;--mute:#9bb0c7;--line:#243652;--blue:#5aa2ee;--soft:#11302a}}
:root[data-theme="dark"]{--bg:#0c1522;--card:#14233a;--ink:#eaf2fb;--mute:#9bb0c7;--line:#243652;--blue:#5aa2ee;--soft:#11302a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Mukta,system-ui,sans-serif}
h1,h2,h3,.bl{font-family:"Baloo 2",Mukta,sans-serif;line-height:1.15;margin:0}
.w{max-width:960px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
header .w{display:flex;align-items:center;gap:8px;height:62px}
.brand{display:flex;align-items:center;gap:9px;font:800 18px "Baloo 2";color:var(--blue);margin-right:auto}.brand img{width:40px;height:40px;border-radius:50%}
.chip{font:800 15px "Baloo 2";padding:6px 11px;border-radius:12px;background:var(--soft)}
.ib{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:38px;min-width:38px;padding:0 10px;font:800 14px "Baloo 2";cursor:pointer}
.btn{display:inline-block;border:0;border-radius:16px;padding:12px 22px;font:800 17px "Baloo 2";color:#fff;background:var(--green);box-shadow:0 4px 0 var(--gd);cursor:pointer;text-decoration:none;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:none}.btn.b{background:var(--blue);box-shadow:0 4px 0 #082f5c}.btn.s{background:var(--saf);box-shadow:0 4px 0 #c2700f;color:#2a1700}.btn.o{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}.btn[disabled]{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
.hero{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center;padding:34px 0}
.hero img{width:200px;height:200px;border-radius:50%;box-shadow:0 10px 30px #0b4a8f33;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(2deg)}}
.hero h1{font-size:clamp(30px,5vw,46px)}.hero p{color:var(--mute);margin:10px 0 18px}
section{padding:26px 0}h2{font-size:28px;margin-bottom:4px}.sub{color:var(--mute);margin:0 0 18px}
#path{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:88px;height:88px;border-radius:50%;border:0;font-size:36px;background:var(--line);color:var(--mute);cursor:pointer;box-shadow:0 7px 0 #0002;position:relative}
.node.cur{background:var(--green);color:#fff;box-shadow:0 7px 0 var(--gd);animation:pu 1.6s infinite}
.node.done{background:var(--saf);color:#fff;box-shadow:0 7px 0 #c2700f}
@keyframes pu{50%{transform:scale(1.08)}}
.lbl{font:800 15px "Baloo 2";text-align:center;margin-bottom:14px}.lbl small{display:block;font:600 12px Mukta;color:var(--mute)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.card h3{font-size:19px}.card p{margin:6px 0 0;color:var(--mute);font-size:15px}
.cert{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
#cv{width:100%;height:auto;border-radius:12px;border:2px solid var(--line);background:#fff}
.warn{background:#fff3e0;color:#7a3e00;border-left:5px solid var(--saf);padding:10px 14px;border-radius:10px;font-weight:600;margin:10px 0}
:root[data-theme="dark"] .warn{background:#3a2a10;color:#ffd9a0}
input.nm{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 14px;font:600 17px Mukta;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
footer{padding:26px 0 40px;color:var(--mute);font-size:14px;text-align:center;border-top:2px solid var(--line)}
#ls{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#ls.on{display:flex}
.lt{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto;padding:16px 18px}
.bar{flex:1;height:16px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width .4s}
.lb{flex:1;max-width:760px;width:100%;margin:0 auto;padding:10px 18px;overflow:auto}
.lb h2{font-size:26px;margin:10px 0 18px}
.op{display:block;width:100%;text-align:left;margin-bottom:11px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;font:600 17px Mukta;cursor:pointer}
.op.sel{border-color:var(--blue);background:var(--soft)}.op.ok{border-color:var(--green);background:var(--soft)}.op.no{border-color:var(--red);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--card)}.fb.ok{background:var(--soft)}.fb.no{background:#fde8e8;color:#7a1d1d}
.fb>div{max-width:760px;margin:auto;display:flex;gap:14px;align-items:center;justify-content:space-between}.fb p{margin:0;font-weight:600}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;animation:cf 2.6s linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.res{text-align:center;padding-top:30px}.res .big{font-size:80px}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.hero img{margin:auto;width:150px;height:150px}.g3,.cert{grid-template-columns:1fr}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.plat{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:800 14px "Baloo 2";color:#fff;padding:7px 14px;border-radius:14px;background:linear-gradient(135deg,#ff9933,#e8590c);box-shadow:0 3px 0 #b34700;animation:gl 2.4s infinite;white-space:nowrap}
@keyframes gl{50%{box-shadow:0 3px 0 #b34700,0 0 16px 4px #ff993399}}.plat .ps{display:none}
.cert{grid-template-columns:1fr!important}#cv{box-shadow:0 14px 40px #0b4a8f33;border-radius:6px}#cv2{width:100%;height:auto;border-radius:6px;box-shadow:0 14px 40px #0b4a8f33;background:#fff}.sco{font-weight:800;color:var(--blue);margin:6px 0}
@media(max-width:700px){.plat .pl{display:none}.plat .ps{display:inline}.plat{padding:7px 10px}}
</style></head><body>

const fname="civic-india";
$("#dn").onclick=()=>{draw();[["#cv",1],["#cv2",2]].forEach(([id,n],j)=>setTimeout(()=>{const a=document.createElement("a");a.download=fname+"-page"+n+".png";a.href=$(id).toDataURL("image/png");a.click()},j*500))};
$("#dp").onclick=()=>{draw();if(!window.jspdf)return $("#dn").click();const p=new jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});p.addImage($("#cv").toDataURL("image/jpeg",.95),"JPEG",0,0,297,210);p.addPage();p.addImage($("#cv2").toDataURL("image/jpeg",.95),"JPEG",0,0,297,210);p.save(fname+".pdf")};
$("#sc").onclick=()=>{draw();Promise.all(["#cv","#cv2"].map((id,i)=>new Promise(r=>$(id).toBlob(b=>r(new File([b],fname+"-page"+(i+1)+".png",{type:"image/png"})))))).then(async fs=>{try{if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs,text:tt("shT"),url:location.href});return}}catch(e){return}$("#dn").click();toast()})};
function toast(){const t=document.createElement("div");t.textContent=tt("copied");t.style.cssText="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#12263f;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;font-weight:800";document.body.append(t);setTimeout(()=>t.remove(),2000)}
$("#sh").onclick=async()=>{try{if(navigator.share)return await navigator.share({title:"Civics Sense India",text:tt("shT"),url:location.href});await navigator.clipboard.writeText(tt("shT")+" "+location.href);toast()}catch(e){}};
apply();document.fonts&&Promise.all(["800 60px Cinzel","600 30px Cinzel","60px \"Great Vibes\"","600 30px \"Cormorant Garamond\"","italic 500 30px \"Cormorant Garamond\""].map(f=>document.fonts.load(f))).then(draw);LOGO.onload=draw;
</script></body></html>
